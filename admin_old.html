<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Administration — Édifice Concept BTP</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--navy:#06366b;--blue:#0b4c91;--gold:#c99324;--ink:#10233e;--muted:#667085;--bg:#f5f7fa;--white:#fff;--line:#e4e8ef}
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;color:var(--ink);background:var(--bg)}
header{background:#fff;border-bottom:1px solid var(--line);padding:14px 20px}.header{max-width:1180px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:16px}.logo{height:54px;width:auto}.logout{background:#fff;color:var(--blue);border:1px solid var(--blue);border-radius:8px;padding:10px 16px;font-weight:700}
main{max-width:1180px;margin:28px auto;padding:0 18px}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:24px;box-shadow:0 8px 25px rgba(16,35,62,.06)}h1{margin:0 0 8px}.muted{color:var(--muted)}
input{width:100%;padding:13px;border:1px solid #ccd4df;border-radius:8px;margin:6px 0 14px;font-size:15px}button{cursor:pointer}.primary{width:100%;background:var(--blue);color:#fff;border:0;border-radius:8px;padding:13px;font-weight:700;font-size:15px}.login{max-width:460px;margin:70px auto}.error{color:#b42318;margin:10px 0}.hidden{display:none}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:20px 0}.stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px}.stat strong{display:block;font-size:28px;color:var(--blue)}
.table-wrap{overflow:auto;background:#fff;border:1px solid var(--line);border-radius:12px}table{width:100%;border-collapse:collapse;min-width:900px}th,td{padding:12px;border-bottom:1px solid var(--line);text-align:left;font-size:14px}th{background:#f8fafc}.badge{display:inline-block;padding:5px 9px;border-radius:20px;background:#eef4ff;color:var(--blue);font-weight:700;font-size:12px}
@media(max-width:700px){.stats{grid-template-columns:1fr}.logo{height:44px}}
</style>
</head>
<body>
<header><div class="header"><img class="logo" src="logo-edifice.png" alt="Édifice Concept BTP"><button id="logoutBtn" class="logout hidden">Déconnexion</button></div></header>
<main>
<section id="loginView" class="card login"><h1>Administration</h1><p class="muted">Accès réservé à Édifice Concept BTP.</p><form id="loginForm"><label>Adresse e-mail</label><input id="email" type="email" autocomplete="username" required><label>Mot de passe</label><input id="password" type="password" autocomplete="current-password" required><div id="loginError" class="error"></div><button class="primary" type="submit">Se connecter</button></form></section>
<section id="adminView" class="hidden"><div class="card"><h1>Tableau de bord</h1><p class="muted">Demandes reçues via le site Édifice Concept BTP.</p></div><div class="stats"><div class="stat"><span class="muted">Total</span><strong id="total">0</strong></div><div class="stat"><span class="muted">Recherche logement</span><strong id="cherche">0</strong></div><div class="stat"><span class="muted">Construction / autres</span><strong id="autres">0</strong></div></div><div class="table-wrap"><table><thead><tr><th>Date</th><th>Type</th><th>Nom</th><th>Téléphone</th><th>Zone</th><th>Bien</th><th>Opération</th><th>Budget</th><th>Détails</th></tr></thead><tbody id="rows"><tr><td colspan="9">Chargement...</td></tr></tbody></table></div></section>
</main>
<script>
const SUPABASE_URL="https://mtirphijhdyjfrfqnmob.supabase.co";
const SUPABASE_KEY="sb_publishable_GKkU7yuDAVmkefNRG9JpMA_KCrAiiMB";
const supabaseClient=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const loginView=document.getElementById("loginView"),adminView=document.getElementById("adminView"),logoutBtn=document.getElementById("logoutBtn");
async function loadDashboard(){const {data,error}=await supabaseClient.from("demandes").select("*").order("created_at",{ascending:false});if(error){document.getElementById("rows").innerHTML="<tr><td colspan='9'>Accès aux demandes non autorisé. La sécurité RLS doit être configurée.</td></tr>";return}document.getElementById("total").textContent=data.length;document.getElementById("cherche").textContent=data.filter(x=>x.demande_type==="cherche").length;document.getElementById("autres").textContent=data.filter(x=>x.demande_type!=="cherche").length;document.getElementById("rows").innerHTML=data.map(x=>`<tr><td>${new Date(x.created_at).toLocaleString("fr-FR")}</td><td><span class="badge">${x.demande_type||""}</span></td><td>${x.nom||""}</td><td>${x.telephone||""}</td><td>${x.zone||""}</td><td>${x.bien_type||""}</td><td>${x.operation||""}</td><td>${x.budget||""}</td><td>${x.details||""}</td></tr>`).join("")}
async function refreshAuth(){const {data:{session}}=await supabaseClient.auth.getSession();if(session){loginView.classList.add("hidden");adminView.classList.remove("hidden");logoutBtn.classList.remove("hidden");loadDashboard()}else{loginView.classList.remove("hidden");adminView.classList.add("hidden");logoutBtn.classList.add("hidden")}}
document.getElementById("loginForm").addEventListener("submit",async e=>{e.preventDefault();document.getElementById("loginError").textContent="";const {error}=await supabaseClient.auth.signInWithPassword({email:document.getElementById("email").value,password:document.getElementById("password").value});if(error){document.getElementById("loginError").textContent="Connexion impossible : "+error.message;return}refreshAuth()});
logoutBtn.addEventListener("click",async()=>{await supabaseClient.auth.signOut();refreshAuth()});refreshAuth();
</script>
</body></html>
